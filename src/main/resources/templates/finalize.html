<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定稿合同 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-check-double"></i> 定稿合同</h4>
        </div>

        <!-- 待定稿合同列表 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-list"></i> 待定稿合同
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>合同编号</th>
                            <th>合同名称</th>
                            <th>客户</th>
                            <th>起草人</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="contract : ${contracts}">
                            <td th:text="${contract.num}">HT2024001</td>
                            <td th:text="${contract.name}">合同名称</td>
                            <td th:text="${contract.customer}">客户名称</td>
                            <td th:text="${contract.userName}">起草人</td>
                            <td th:text="${contract.beginTime != null ? #dates.format(contract.beginTime, 'yyyy-MM-dd') : ''}">2024-01-01</td>
                            <td th:text="${contract.endTime != null ? #dates.format(contract.endTime, 'yyyy-MM-dd') : ''}">2024-12-31</td>
                            <td class="text-nowrap">
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:onclick="'viewOpinions(\'' + ${contract.num} + '\')'">
                                    <i class="fas fa-comments"></i> 会签意见
                                </button>
                                <button type="button" class="btn btn-sm btn-success"
                                        th:onclick="'openFinalize(\'' + ${contract.num} + '\')'">
                                    <i class="fas fa-edit"></i> 定稿
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contracts)}">
                            <td colspan="7" class="text-center" style="padding: 30px; color: #999;">
                                <i class="fas fa-inbox"></i> 暂无待定稿合同
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 会签意见模态框 -->
    <div id="opinionsModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog" style="max-width: 700px;">
            <div class="modal-header">
                <h5><i class="fas fa-comments"></i> 会签意见</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('opinionsModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="opinionsList">
            </div>
        </div>
    </div>

    <!-- 定稿模态框 -->
    <div id="finalizeModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog" style="max-width: 700px;">
            <div class="modal-header">
                <h5><i class="fas fa-edit"></i> 修改合同内容并定稿</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('finalizeModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="fzContractNum">
                <div class="form-group">
                    <label>合同名称</label>
                    <input type="text" class="form-control" id="fzName" readonly>
                </div>
                <div class="form-group">
                    <label for="fzContent">合同内容 <span class="required">*</span></label>
                    <textarea class="form-control" id="fzContent" rows="10"
                              placeholder="请修改合同内容"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" onclick="submitFinalize()">
                    <i class="fas fa-check"></i> 提交定稿
                </button>
                <button type="button" class="btn btn-secondary" onclick="closeModal('finalizeModal')">
                    <i class="fas fa-times"></i> 取消
                </button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function viewOpinions(num) {
            fetchData('/api/contract/opinions?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var html = '';
                    var list = result.data || [];
                    if (list.length === 0) {
                        html = '<div style="text-align: center; padding: 20px; color: #999;">暂无会签意见</div>';
                    } else {
                        list.forEach(function(item) {
                            html += '<div style="border-bottom: 1px solid #eee; padding: 12px 0;">' +
                                '<div style="display: flex; justify-content: space-between; margin-bottom: 6px;">' +
                                '<strong><i class="fas fa-user"></i> ' + item.userName + '</strong>' +
                                '<span style="color: #999; font-size: 12px;">' + formatDate(item.time) + '</span>' +
                                '</div>' +
                                '<div style="padding: 8px; background: #f8f9fa; border-radius: 4px;">' + (item.content || '无意见') + '</div>' +
                                '</div>';
                        });
                    }
                    document.getElementById('opinionsList').innerHTML = html;
                    openModal('opinionsModal');
                } else {
                    showMessage(result.message || '获取会签意见失败', 'danger');
                }
            });
        }

        function openFinalize(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    document.getElementById('fzContractNum').value = c.num;
                    document.getElementById('fzName').value = c.name;
                    document.getElementById('fzContent').value = c.content || '';
                    openModal('finalizeModal');
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function submitFinalize() {
            var num = document.getElementById('fzContractNum').value;
            var content = document.getElementById('fzContent').value.trim();
            if (!content) {
                showMessage('请输入合同内容', 'danger');
                return;
            }
            submitForm('/api/contract/finalize', {
                contractNum: num,
                content: content
            }, function(result) {
                if (result.success) {
                    showMessage('定稿提交成功', 'success');
                    closeModal('finalizeModal');
                    setTimeout(function() { location.reload(); }, 1500);
                } else {
                    showMessage(result.message || '定稿提交失败', 'danger');
                }
            });
        }
    </script>
</body>
</html>
