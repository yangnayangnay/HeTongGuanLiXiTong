<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- 顶部导航栏 -->
        <header class="main-header">
            <div class="header-title">
                <i class="fas fa-file-contract"></i>
                <span>合同管理系统</span>
            </div>
            <div class="header-user">
                <span class="user-name">
                    <i class="fas fa-user-circle"></i>
                    <span th:text="${session.userName} ?: '未登录'">当前用户</span>
                </span>
                <a href="/pending" title="我的待办">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="/logout" title="注销">
                    <i class="fas fa-sign-out-alt"></i> 注销
                </a>
            </div>
        </header>

        <!-- 主体区域 -->
        <div class="main-body">
            <!-- 左侧导航栏 -->
            <nav class="main-sidebar">
                <ul class="sidebar-menu">
                    <!-- 合同管理 -->
                    <li class="menu-header">合同管理</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F01')}" href="/draft" target="contentFrame">
                            <i class="fas fa-pen-fancy"></i> <span>起草合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F02')}" href="/countersign" target="contentFrame">
                            <i class="fas fa-users"></i> <span>会签合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F03')}" href="/finalize" target="contentFrame">
                            <i class="fas fa-check-double"></i> <span>定稿合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F04')}" href="/approve" target="contentFrame">
                            <i class="fas fa-thumbs-up"></i> <span>审批合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F05')}" href="/sign" target="contentFrame">
                            <i class="fas fa-signature"></i> <span>签订合同</span>
                        </a>
                    </li>

                    <!-- 查询统计 -->
                    <li class="menu-header">查询统计</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F07')}" href="/query" target="contentFrame">
                            <i class="fas fa-search"></i> <span>合同查询</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F08')}" href="/flow" target="contentFrame">
                            <i class="fas fa-project-diagram"></i> <span>流程查询</span>
                        </a>
                    </li>

                    <!-- 基础数据 -->
                    <li class="menu-header">基础数据</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F09')}" href="/customer" target="contentFrame">
                            <i class="fas fa-building"></i> <span>客户管理</span>
                        </a>
                    </li>

                    <!-- 系统管理 -->
                    <li class="menu-header" th:if="${functions.contains('F06') or functions.contains('F10') or functions.contains('F11') or functions.contains('F12')}">系统管理</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F06')}" href="/assign" target="contentFrame">
                            <i class="fas fa-tasks"></i> <span>分配合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F10')}" href="/user" target="contentFrame">
                            <i class="fas fa-users-cog"></i> <span>用户管理</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F11')}" href="/role" target="contentFrame">
                            <i class="fas fa-user-shield"></i> <span>角色管理</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F12')}" href="/log" target="contentFrame">
                            <i class="fas fa-clipboard-list"></i> <span>日志管理</span>
                        </a>
                    </li>

                    <!-- 更多功能 -->
                    <li class="menu-header">更多功能</li>
                    <li>
                        <a class="menu-item" href="/kanban" target="contentFrame">
                            <i class="fas fa-columns"></i> <span>流程看板</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" href="/statistics" target="contentFrame">
                            <i class="fas fa-chart-bar"></i> <span>统计分析</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" href="/settings" target="contentFrame">
                            <i class="fas fa-cog"></i> <span>系统设置</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" href="/about" target="contentFrame">
                            <i class="fas fa-info-circle"></i> <span>关于系统</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- 右侧内容区 -->
            <div class="main-content" style="padding: 0;">
                <iframe name="contentFrame" class="content-frame" src="/pending"></iframe>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // 菜单项点击高亮
        document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(item) {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(el) {
                    el.classList.remove('active');
                });
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
