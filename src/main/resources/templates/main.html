<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- 顶部导航栏 -->
        <header class="main-header">
            <div class="header-title">
                <i class="fas fa-file-contract"></i>
                <span>合同管理系统</span>
            </div>
            <div class="header-user">
                <span class="user-name">
                    <i class="fas fa-user-circle"></i>
                    <span th:text="${session.userName} ?: '未登录'">当前用户</span>
                </span>
                <a href="javascript:void(0)" title="我的待办" onclick="openPending()" style="position:relative;">
                    <i class="fas fa-bell"></i>
                    <span id="taskBadge" style="display:none;position:absolute;top:-6px;right:-8px;background:#e74c3c;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:11px;text-align:center;line-height:18px;"></span>
                </a>
                <a href="/pending" title="待办列表">
                    <i class="fas fa-tasks"></i>
                </a>
                <a href="/logout" title="退出登录" style="color:#e74c3c;font-weight:bold;" onclick="return confirm('确定要退出登录吗？')">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </a>
            </div>
        </header>

        <!-- 主体区域 -->
        <div class="main-body">
            <!-- 左侧导航栏 -->
            <nav class="main-sidebar">
                <ul class="sidebar-menu">
                    <!-- 合同管理 -->
                    <li class="menu-header">合同管理</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F01')}" href="/draft" target="contentFrame">
                            <i class="fas fa-pen-fancy"></i> <span>起草合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F02')}" href="/countersign" target="contentFrame">
                            <i class="fas fa-users"></i> <span>会签合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F03')}" href="/finalize" target="contentFrame">
                            <i class="fas fa-check-double"></i> <span>定稿合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F04')}" href="/approve" target="contentFrame">
                            <i class="fas fa-thumbs-up"></i> <span>审批合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F05')}" href="/sign" target="contentFrame">
                            <i class="fas fa-signature"></i> <span>签订合同</span>
                        </a>
                    </li>

                    <!-- 查询统计 -->
                    <li class="menu-header">查询统计</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F07')}" href="/query" target="contentFrame">
                            <i class="fas fa-search"></i> <span>合同查询</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F08')}" href="/flow" target="contentFrame">
                            <i class="fas fa-project-diagram"></i> <span>流程查询</span>
                        </a>
                    </li>

                    <!-- 基础数据 -->
                    <li class="menu-header">基础数据</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F09')}" href="/customer" target="contentFrame">
                            <i class="fas fa-building"></i> <span>客户管理</span>
                        </a>
                    </li>

                    <!-- 系统管理 -->
                    <li class="menu-header" th:if="${functions.contains('F06') or functions.contains('F10') or functions.contains('F11') or functions.contains('F12')}">系统管理</li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F06')}" href="/assign" target="contentFrame">
                            <i class="fas fa-tasks"></i> <span>分配合同</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F10')}" href="/user" target="contentFrame">
                            <i class="fas fa-users-cog"></i> <span>用户管理</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F11')}" href="/role" target="contentFrame">
                            <i class="fas fa-user-shield"></i> <span>角色管理</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" th:if="${functions.contains('F12')}" href="/log" target="contentFrame">
                            <i class="fas fa-clipboard-list"></i> <span>日志管理</span>
                        </a>
                    </li>

                    <!-- 更多功能 -->
                    <li class="menu-header">更多功能</li>
                    <li>
                        <a class="menu-item" href="/kanban" target="contentFrame">
                            <i class="fas fa-columns"></i> <span>流程看板</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" href="/statistics" target="contentFrame">
                            <i class="fas fa-chart-bar"></i> <span>统计分析</span>
                        </a>
                    </li>
                    <li th:if="${functions.contains('F10') or functions.contains('F11')}">
                        <a class="menu-item" href="/settings" target="contentFrame">
                            <i class="fas fa-cog"></i> <span>系统设置</span>
                        </a>
                    </li>
                    <li>
                        <a class="menu-item" href="/about" target="contentFrame">
                            <i class="fas fa-info-circle"></i> <span>关于系统</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- 右侧内容区 -->
            <div class="main-content" style="padding: 0; position: relative;">
                <div id="frameLoading" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.85);z-index:100;display:flex;align-items:center;justify-content:center;">
                    <div style="text-align:center;color:#666;">
                        <i class="fas fa-spinner fa-spin" style="font-size:28px;color:#3498db;"></i>
                        <div style="margin-top:10px;">加载中...</div>
                    </div>
                </div>
                <iframe name="contentFrame" class="content-frame" src="/pending"></iframe>
            </div>
        </div>
    </div>

    <!-- 任务通知弹窗 -->
    <div id="taskPanel" style="display:none;position:fixed;top:50px;right:20px;width:360px;max-height:450px;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:2000;overflow:hidden;">
        <div style="padding:12px 16px;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;display:flex;justify-content:space-between;align-items:center;">
            <strong><i class="fas fa-bell"></i> 待办任务通知</strong>
            <button onclick="toggleTaskPanel()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div id="taskList" style="padding:8px;max-height:380px;overflow-y:auto;">
            <div style="text-align:center;padding:20px;color:#999;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function showFrameLoading() {
            var el = document.getElementById('frameLoading');
            if (el) el.style.display = 'flex';
        }
        function hideFrameLoading() {
            var el = document.getElementById('frameLoading');
            if (el) el.style.display = 'none';
        }

        // 菜单项点击高亮 + 显示loading
        document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(item) {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(el) {
                    el.classList.remove('active');
                });
                this.classList.add('active');
                showFrameLoading();
            });
        });

        // 根据iframe当前URL高亮左侧菜单
        function highlightMenu() {
            var iframe = document.querySelector('iframe[name="contentFrame"]');
            if (!iframe) return;
            var src = '';
            try { src = iframe.contentWindow.location.pathname; } catch(e) { src = iframe.src; }
            document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(item) {
                item.classList.remove('active');
                var href = item.getAttribute('href');
                if (href && src.indexOf(href) === 0) {
                    item.classList.add('active');
                }
            });
        }

        // iframe加载完成后高亮 + 隐藏loading
        var iframe = document.querySelector('iframe[name="contentFrame"]');
        if (iframe) {
            iframe.addEventListener('load', function() {
                hideFrameLoading();
                highlightMenu();
            });
        }
        showFrameLoading();
        highlightMenu();

        // ===== 任务通知系统 =====
        var taskPanelVisible = false;

        // 点击铃铛打开待办页面
        function openPending() {
            var frame = document.querySelector('iframe[name="contentFrame"]');
            if (frame) {
                frame.src = '/pending';
                highlightMenu();
            }
        }

        function toggleTaskPanel() {
            var panel = document.getElementById('taskPanel');
            taskPanelVisible = !taskPanelVisible;
            panel.style.display = taskPanelVisible ? 'block' : 'none';
            if (taskPanelVisible) {
                loadTaskList();
            }
        }

        function loadTaskList() {
            fetch('/api/tasks/pending').then(function(r) { return r.json(); })
            .then(function(result) {
                var listEl = document.getElementById('taskList');
                if (!result.success || !result.data || result.data.length === 0) {
                    listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#999;"><i class="fas fa-check-circle" style="font-size:24px;color:#27ae60;"></i><br>暂无待办任务</div>';
                    return;
                }
                var html = '';
                result.data.forEach(function(task) {
                    var typeIcon, typeName, typeColor;
                    if (task.type === 0) { typeIcon = 'fa-edit'; typeName = '定稿'; typeColor = '#f39c12'; }
                    else if (task.type === 1) { typeIcon = 'fa-users'; typeName = '会签'; typeColor = '#3498db'; }
                    else if (task.type === 2) { typeIcon = 'fa-thumbs-up'; typeName = '审批'; typeColor = '#e67e22'; }
                    else if (task.type === 3) { typeIcon = 'fa-signature'; typeName = '签订'; typeColor = '#27ae60'; }
                    else if (task.type === 4) { typeIcon = 'fa-user-clock'; typeName = '用户审核'; typeColor = '#9b59b6'; }
                    else { typeIcon = 'fa-tasks'; typeName = '待办'; typeColor = '#95a5a6'; }
                    html += '<div style="padding:10px;border-bottom:1px solid #eee;cursor:pointer;" onclick="goToTask(\'' + task.type + '\')" onmouseover="this.style.background=\'#f0f7ff\'" onmouseout="this.style.background=\'\'">' +
                        '<div style="display:flex;align-items:center;gap:8px;">' +
                        '<i class="fas ' + typeIcon + '" style="color:' + typeColor + ';font-size:16px;"></i>' +
                        '<div style="flex:1;">' +
                        '<div style="font-weight:600;font-size:13px;">' + (task.contractName || task.conNum || task.userName) + '</div>' +
                        '<div style="font-size:12px;color:#666;">待' + typeName + (task.conNum ? ' · ' + task.conNum : '') + '</div>' +
                        '</div>' +
                        '<span style="background:' + typeColor + ';color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;">' + typeName + '</span>' +
                        '</div></div>';
                });
                listEl.innerHTML = html;
            }).catch(function() {
                document.getElementById('taskList').innerHTML = '<div style="text-align:center;padding:20px;color:#e74c3c;">加载失败</div>';
            });
        }

        function goToTask(type) {
            var urls = {0: '/finalize', 1: '/countersign', 2: '/approve', 3: '/sign', 4: '/user'};
            var url = urls[type] || '/pending';
            var frame = document.querySelector('iframe[name="contentFrame"]');
            if (frame) frame.src = url;
            toggleTaskPanel();
            highlightMenu();
        }

        // 页面加载时检查待办任务数量
        function checkPendingTasks() {
            fetch('/api/tasks/pending').then(function(r) { return r.json(); })
            .then(function(result) {
                var badge = document.getElementById('taskBadge');
                if (result.success && result.data && result.data.length > 0) {
                    badge.textContent = result.data.length;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }).catch(function() {});
        }

        // 监听iframe消息，任务完成后刷新铃铛数量
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'taskCompleted') {
                checkPendingTasks();
            }
        });

        // 初始加载和定时刷新
        checkPendingTasks();
        setInterval(checkPendingTasks, 5000);
    </script>
</body>
</html>
