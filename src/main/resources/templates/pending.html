<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待办 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
            <h4><i class="fas fa-bell"></i> 我的待办</h4>
            <button class="btn btn-sm btn-outline-primary" onclick="loadPending()"><i class="fas fa-sync-alt"></i> 刷新</button>
        </div>

        <!-- 加载中提示 -->
        <div class="content-card" id="loadingTip" style="text-align:center;padding:40px;color:#999;">
            <i class="fas fa-spinner fa-spin" style="font-size:24px;"></i>
            <p style="margin-top:10px;">加载中...</p>
        </div>

        <!-- 待办内容容器 -->
        <div id="pendingContainer" style="display:none;"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function loadPending() {
            document.getElementById('loadingTip').style.display = 'block';
            document.getElementById('pendingContainer').style.display = 'none';
            fetchData('/api/tasks/pending', function(result) {
                document.getElementById('loadingTip').style.display = 'none';
                document.getElementById('pendingContainer').style.display = 'block';
                if (!result.success) {
                    document.getElementById('pendingContainer').innerHTML =
                        '<div class="content-card"><div style="text-align:center;padding:40px;color:#e74c3c;"><i class="fas fa-exclamation-circle"></i> ' + (result.message || '加载失败') + '</div></div>';
                    return;
                }
                renderPending(result.data || []);
            });
        }

        function renderPending(tasks) {
            var finalizeTasks = [];
            var countersignTasks = [];
            var approveTasks = [];
            var signTasks = [];
            var userReviewTasks = [];
            tasks.forEach(function(t) {
                if (t.type === 0) finalizeTasks.push(t);
                else if (t.type === 1) countersignTasks.push(t);
                else if (t.type === 2) approveTasks.push(t);
                else if (t.type === 3) signTasks.push(t);
                else if (t.type === 4) userReviewTasks.push(t);
            });

            var html = '';
            if (finalizeTasks.length === 0 && countersignTasks.length === 0 && approveTasks.length === 0 && signTasks.length === 0 && userReviewTasks.length === 0) {
                html = '<div class="content-card"><div style="text-align:center;padding:60px;color:#999;">' +
                    '<i class="fas fa-check-circle" style="font-size:48px;color:#27AE60;margin-bottom:16px;"></i>' +
                    '<p style="font-size:16px;">暂无待办任务</p>' +
                    '<p style="font-size:13px;">所有任务已处理完毕</p></div></div>';
            } else {
                if (userReviewTasks.length > 0) {
                    html += renderUserReviewGroup(userReviewTasks);
                }
                if (finalizeTasks.length > 0) {
                    html += renderGroup('待定稿', 'fa-edit', 'badge-finalize', finalizeTasks, '去定稿', '/finalize', 'fa-edit', 'btn-warning');
                }
                if (countersignTasks.length > 0) {
                    html += renderGroup('待会签', 'fa-users', 'badge-countersign', countersignTasks, '去会签', '/countersign', 'fa-pen', 'btn-success');
                }
                if (approveTasks.length > 0) {
                    html += renderGroup('待审批', 'fa-thumbs-up', 'badge-approve', approveTasks, '去审批', '/approve', 'fa-check', 'btn-success');
                }
                if (signTasks.length > 0) {
                    html += renderGroup('待签订', 'fa-signature', 'badge-sign', signTasks, '去签订', '/sign', 'fa-signature', 'btn-success');
                }
            }
            document.getElementById('pendingContainer').innerHTML = html;
        }

        function renderUserReviewGroup(tasks) {
            var rows = '';
            tasks.forEach(function(t) {
                rows += '<tr>' +
                    '<td>' + (t.userName || '') + '</td>' +
                    '<td>新用户注册待审核</td>' +
                    '<td><a href="/user" class="btn btn-sm btn-warning" target="contentFrame"><i class="fas fa-user-check"></i> 去审核</a></td>' +
                    '</tr>';
            });
            return '<div class="todo-group">' +
                '<div class="group-title"><i class="fas fa-user-clock"></i> 待审核用户' +
                ' <span class="badge badge-pending">' + tasks.length + '</span></div>' +
                '<div class="content-card" style="margin-bottom:0;"><div class="table-wrapper">' +
                '<table class="data-table"><thead><tr><th>用户名</th><th>说明</th><th>操作</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div></div></div>';
        }

        function renderGroup(title, icon, badgeClass, tasks, btnText, btnHref, btnIcon, btnColor) {
            var rows = '';
            tasks.forEach(function(t) {
                rows += '<tr>' +
                    '<td>' + (t.conNum || '') + '</td>' +
                    '<td>' + (t.contractName || '') + '</td>' +
                    '<td>' + (t.customer || '-') + '</td>' +
                    '<td>' + (t.userName || '-') + '</td>' +
                    '<td><a href="' + btnHref + '" class="btn btn-sm ' + btnColor + '" target="contentFrame"><i class="fas ' + btnIcon + '"></i> ' + btnText + '</a></td>' +
                    '</tr>';
            });
            return '<div class="todo-group">' +
                '<div class="group-title"><i class="fas ' + icon + '"></i> ' + title +
                ' <span class="badge ' + badgeClass + '">' + tasks.length + '</span></div>' +
                '<div class="content-card" style="margin-bottom:0;"><div class="table-wrapper">' +
                '<table class="data-table"><thead><tr><th>合同编号</th><th>合同名称</th><th>客户</th><th>起草人</th><th>操作</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div></div></div>';
        }

        loadPending();
    </script>
</body>
</html>
