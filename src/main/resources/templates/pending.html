<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待办 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-bell"></i> 我的待办</h4>
        </div>

        <!-- 待会签任务 -->
        <div class="todo-group" th:if="${not #lists.isEmpty(countersignTasks)}">
            <div class="group-title">
                <i class="fas fa-users"></i> 待会签
                <span class="badge badge-countersign" th:text="${#lists.size(countersignTasks)}">0</span>
            </div>
            <div class="content-card" style="margin-bottom: 0;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>合同编号</th>
                                <th>合同名称</th>
                                <th>客户</th>
                                <th>起草人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${countersignTasks}">
                                <td th:text="${task.num}">HT2024001</td>
                                <td th:text="${task.name}">合同名称</td>
                                <td th:text="${task.customer}">客户</td>
                                <td th:text="${task.userName}">起草人</td>
                                <td>
                                    <a href="/countersign" class="btn btn-sm btn-success" target="contentFrame">
                                        <i class="fas fa-pen"></i> 去会签
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 待审批任务 -->
        <div class="todo-group" th:if="${not #lists.isEmpty(approveTasks)}">
            <div class="group-title">
                <i class="fas fa-thumbs-up"></i> 待审批
                <span class="badge badge-approve" th:text="${#lists.size(approveTasks)}">0</span>
            </div>
            <div class="content-card" style="margin-bottom: 0;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>合同编号</th>
                                <th>合同名称</th>
                                <th>客户</th>
                                <th>起草人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${approveTasks}">
                                <td th:text="${task.num}">HT2024001</td>
                                <td th:text="${task.name}">合同名称</td>
                                <td th:text="${task.customer}">客户</td>
                                <td th:text="${task.userName}">起草人</td>
                                <td>
                                    <a href="/approve" class="btn btn-sm btn-success" target="contentFrame">
                                        <i class="fas fa-check"></i> 去审批
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 待签订任务 -->
        <div class="todo-group" th:if="${not #lists.isEmpty(signTasks)}">
            <div class="group-title">
                <i class="fas fa-signature"></i> 待签订
                <span class="badge badge-sign" th:text="${#lists.size(signTasks)}">0</span>
            </div>
            <div class="content-card" style="margin-bottom: 0;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>合同编号</th>
                                <th>合同名称</th>
                                <th>客户</th>
                                <th>起草人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${signTasks}">
                                <td th:text="${task.num}">HT2024001</td>
                                <td th:text="${task.name}">合同名称</td>
                                <td th:text="${task.customer}">客户</td>
                                <td th:text="${task.userName}">起草人</td>
                                <td>
                                    <a href="/sign" class="btn btn-sm btn-success" target="contentFrame">
                                        <i class="fas fa-signature"></i> 去签订
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 无待办任务 -->
        <div class="content-card" th:if="${#lists.isEmpty(countersignTasks) and #lists.isEmpty(approveTasks) and #lists.isEmpty(signTasks)}">
            <div style="text-align: center; padding: 60px; color: #999;">
                <i class="fas fa-check-circle" style="font-size: 48px; color: #27AE60; margin-bottom: 16px;"></i>
                <p style="font-size: 16px;">暂无待办任务</p>
                <p style="font-size: 13px;">所有任务已处理完毕</p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
