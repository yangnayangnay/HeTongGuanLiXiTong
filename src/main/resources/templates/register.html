<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">
                <i class="fas fa-user-plus" style="color: #27AE60;"></i> 用户注册
            </div>
            <div class="auth-subtitle">Contract Management System - Register</div>

            <!-- 错误消息 -->
            <div class="error-message" th:if="${param.error}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${param.error}">注册失败</span>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> 用户名
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> 密码
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> 确认密码
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                               placeholder="请再次输入密码" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> 邮箱
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        </div>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="请输入邮箱地址（必填）" required>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-auth btn-register" style="flex: 1;">
                        <i class="fas fa-user-plus"></i> 注 册
                    </button>
                    <a href="/login" class="btn btn-auth btn-secondary" style="flex: 1; text-align: center; text-decoration: none;">
                        <i class="fas fa-arrow-left"></i> 取 消
                    </a>
                </div>
            </form>

            <div class="auth-links">
                已有账号？<a href="/login">立即登录</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var confirmPassword = document.getElementById('confirmPassword').value.trim();
            var email = document.getElementById('email').value.trim();

            if (!username || !password) {
                showMessage('请输入用户名和密码', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'danger');
                return;
            }

            if (password.length < 4) {
                showMessage('密码长度不能少于4位', 'danger');
                return;
            }

            if (!email) {
                showMessage('请输入邮箱地址', 'danger');
                return;
            }

            var formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('email', email);
            fetch('/api/register', {
                method: 'POST',
                body: formData
            })
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    storeMessage('注册成功，请等待管理员审核', 'success');
                    setTimeout(function() { window.location.href = '/login'; }, 500);
                } else {
                    showMessage(result.message || '注册失败', 'danger');
                }
            })
            .catch(function(error) {
                console.error('注册失败:', error);
                showMessage('注册请求失败', 'danger');
            });
        });
    </script>
</body>
</html>
