<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志管理 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-clipboard-list"></i> 日志管理</h4>
        </div>

        <!-- 日志列表 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-list"></i> 操作日志
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">序号</th>
                            <th>操作人</th>
                            <th>操作内容</th>
                            <th>操作时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log, stat : ${logs}">
                            <td class="text-center" th:text="${stat.count}">1</td>
                            <td th:text="${log.userName}">操作人</td>
                            <td th:text="${log.content}">操作内容</td>
                            <td th:text="${log.time != null ? #dates.format(log.time, 'yyyy-MM-dd HH:mm:ss') : ''}">2024-01-01 12:00:00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="4" class="text-center" style="padding: 30px; color: #999;">
                                <i class="fas fa-inbox"></i> 暂无日志记录
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
