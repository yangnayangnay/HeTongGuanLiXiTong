<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">
                <i class="fas fa-file-contract" style="color: #2980B9;"></i> 合同管理系统
            </div>
            <div class="auth-subtitle">Contract Management System</div>

            <!-- 错误消息 -->
            <div class="error-message" th:if="${param.error}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${param.error}">用户名或密码错误</span>
            </div>

            <form id="loginForm" action="/login" method="post">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> 用户名
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> 密码
                    </label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-auth btn-login">
                    <i class="fas fa-sign-in-alt"></i> 登 录
                </button>
            </form>

            <div class="auth-links">
                还没有账号？<a href="/register">立即注册</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showMessage('请输入用户名和密码', 'danger');
                return;
            }

            var formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('/api/login', {
                method: 'POST',
                body: formData
            })
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    window.location.href = '/main';
                } else {
                    showMessage(result.message || '登录失败，请检查用户名和密码', 'danger');
                }
            })
            .catch(function(error) {
                console.error('登录失败:', error);
                showMessage('登录请求失败，请稍后重试', 'danger');
            });
        });
    </script>
</body>
</html>
