<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <div class="page-header">
            <h4><i class="fas fa-cog"></i> 系统设置</h4>
        </div>

        <!-- 主题设置 -->
        <div class="content-card">
            <div class="card-title"><i class="fas fa-palette"></i> 主题设置</div>
            <div class="form-group">
                <label>选择主题</label>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button class="btn btn-outline-primary theme-btn" onclick="setTheme('light')"><i class="fas fa-sun"></i> 浅色</button>
                    <button class="btn btn-outline-dark theme-btn" onclick="setTheme('dark')"><i class="fas fa-moon"></i> 深色</button>
                    <button class="btn btn-outline-info theme-btn" onclick="setTheme('blue')"><i class="fas fa-water"></i> 蓝色</button>
                    <button class="btn btn-outline-success theme-btn" onclick="setTheme('green')"><i class="fas fa-leaf"></i> 绿色</button>
                </div>
            </div>
        </div>

        <!-- 邮件设置 -->
        <div class="content-card" style="margin-top: 16px;">
            <div class="card-title"><i class="fas fa-envelope"></i> 邮件服务配置</div>
            <div class="alert alert-warning" style="margin-bottom:12px;">
                <i class="fas fa-exclamation-triangle"></i> <strong>重要：</strong>QQ邮箱需先开启SMTP服务并获取授权码（QQ邮箱 → 设置 → 账户 → POP3/SMTP服务 → 生成授权码），填入下方"授权码"栏位
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label>发件人邮箱</label>
                    <input type="email" class="form-control" id="senderEmail" value="2120951033@qq.com" onchange="autoDetectSmtp()">
                    <small class="form-text text-muted">输入邮箱后自动识别SMTP服务器</small>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>授权码</label>
                    <input type="password" class="form-control" id="senderPassword" value="hocrfflyfocycabi">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label>SMTP服务器</label>
                    <input type="text" class="form-control" id="smtpHost" value="smtp.qq.com">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>端口</label>
                    <input type="number" class="form-control" id="smtpPort" value="465">
                </div>
            </div>
            <div class="form-row" style="margin-top:8px;">
                <div class="form-group" style="flex:1;">
                    <label>测试收件人邮箱</label>
                    <input type="email" class="form-control" id="testEmailTo" value="2120951033@qq.com" placeholder="输入收件人邮箱">
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveEmailConfig()"><i class="fas fa-save"></i> 保存邮件配置</button>
            <button class="btn btn-success ml-2" onclick="testEmail()"><i class="fas fa-paper-plane"></i> 发送测试邮件</button>
            <span id="emailTestResult" style="margin-left: 10px;"></span>
        </div>

        <!-- AI设置 -->
        <div class="content-card" style="margin-top: 16px;">
            <div class="card-title"><i class="fas fa-robot"></i> AI助手配置</div>
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label>Ollama服务地址</label>
                    <input type="text" class="form-control" id="aiUrl" value="http://localhost:11434">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>模型名称</label>
                    <input type="text" class="form-control" id="aiModel" value="qwen2:7b">
                </div>
            </div>
            <button class="btn btn-info" onclick="testAI()"><i class="fas fa-vial"></i> 测试连接</button>
            <button class="btn btn-primary ml-2" onclick="saveAIConfig()"><i class="fas fa-save"></i> 保存AI配置</button>
            <span id="aiTestResult" style="margin-left: 10px;"></span>
        </div>

        <!-- 提醒设置 -->
        <div class="content-card" style="margin-top: 16px;">
            <div class="card-title"><i class="fas fa-bell"></i> 提醒设置</div>
            <div class="form-group">
                <label>任务检查间隔（分钟）</label>
                <input type="number" class="form-control" id="reminderInterval" value="30" min="5" max="120" style="max-width: 200px;">
            </div>
            <div class="form-group">
                <label>提示音效</label>
                <select class="form-control" id="soundType" style="max-width: 200px;">
                    <option value="default">系统默认</option>
                    <option value="silent">静音</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="saveReminderConfig()"><i class="fas fa-save"></i> 保存提醒设置</button>
        </div>

        <!-- 电子签名设置 -->
        <div class="content-card" style="margin-top: 16px;">
            <div class="card-title"><i class="fas fa-signature"></i> 电子签名设置</div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="autoLoadSignature" onchange="saveSignatureConfig()">
                    在起草合同时自动预放上次的电子签名
                </label>
                <small class="form-text text-muted">勾选后，起草合同页面会自动加载上次使用的电子签名；取消勾选则每次需要手动插入签名</small>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function setTheme(theme) {
            document.body.className = 'theme-' + theme;
            localStorage.setItem('theme', theme);
            showMessage('主题已切换', 'success');
        }
        // Load saved theme
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.body.className = 'theme-' + savedTheme;

        // 常见邮箱SMTP服务器配置
        var smtpConfigMap = {
            'qq.com':       { host: 'smtp.qq.com',       port: 465, ssl: true },
            '163.com':      { host: 'smtp.163.com',      port: 465, ssl: true },
            '126.com':      { host: 'smtp.126.com',      port: 465, ssl: true },
            'yeah.net':     { host: 'smtp.yeah.net',     port: 465, ssl: true },
            'sina.com':     { host: 'smtp.sina.com',     port: 465, ssl: true },
            'sina.cn':      { host: 'smtp.sina.cn',      port: 465, ssl: true },
            'sohu.com':     { host: 'smtp.sohu.com',     port: 465, ssl: true },
            '139.com':      { host: 'smtp.139.com',      port: 465, ssl: true },
            'aliyun.com':   { host: 'smtp.aliyun.com',   port: 465, ssl: true },
            'hotmail.com':  { host: 'smtp.office365.com', port: 587, ssl: false },
            'outlook.com':  { host: 'smtp.office365.com', port: 587, ssl: false },
            'live.com':     { host: 'smtp.office365.com', port: 587, ssl: false },
            'live.cn':      { host: 'smtp.office365.com', port: 587, ssl: false },
            'gmail.com':    { host: 'smtp.gmail.com',    port: 587, ssl: false },
            'yahoo.com':    { host: 'smtp.mail.yahoo.com', port: 465, ssl: true },
            'yahoo.cn':     { host: 'smtp.mail.yahoo.cn', port: 465, ssl: true },
            'bjtu.edu.cn':  { host: 'mail.bjtu.edu.cn',  port: 465, ssl: true },
            'edu.cn':       { host: '', port: 465, ssl: true }
        };

        function autoDetectSmtp() {
            var email = document.getElementById('senderEmail').value.trim();
            if (!email || email.indexOf('@') === -1) return;
            var domain = email.split('@')[1].toLowerCase();
            var config = smtpConfigMap[domain];
            // 如果没有精确匹配，尝试顶级域名匹配
            if (!config) {
                var parts = domain.split('.');
                for (var i = 1; i < parts.length; i++) {
                    var suffix = parts.slice(i).join('.');
                    if (smtpConfigMap[suffix]) {
                        config = smtpConfigMap[suffix];
                        break;
                    }
                }
            }
            if (config && config.host) {
                document.getElementById('smtpHost').value = config.host;
                document.getElementById('smtpPort').value = config.port;
                showMessage('已自动识别邮箱: ' + domain + ' → ' + config.host + ':' + config.port, 'success');
            } else if (domain) {
                // 未识别的域名，推测为 smtp.域名
                document.getElementById('smtpHost').value = 'smtp.' + domain;
                document.getElementById('smtpPort').value = 465;
                showMessage('未在已知列表中找到 ' + domain + '，已推测为 smtp.' + domain + '，请确认', 'info');
            }
        }

        function saveEmailConfig() {
            var config = {
                host: document.getElementById('smtpHost').value,
                port: document.getElementById('smtpPort').value,
                email: document.getElementById('senderEmail').value,
                password: document.getElementById('senderPassword').value
            };
            if (!config.email || !config.password) {
                showMessage('请填写发件人邮箱和授权码', 'danger');
                return;
            }
            submitForm('/api/settings/email', config, function(result) {
                if (result.success) showMessage('邮件配置已保存并启用', 'success');
                else showMessage(result.message || '保存失败', 'danger');
            });
        }

        function testEmail() {
            var toEmail = document.getElementById('testEmailTo').value.trim();
            if (!toEmail) {
                showMessage('请填写测试收件人邮箱', 'danger');
                return;
            }
            var email = document.getElementById('senderEmail').value.trim();
            var password = document.getElementById('senderPassword').value.trim();
            if (!email || !password) {
                showMessage('请先填写发件人邮箱和授权码并保存', 'danger');
                return;
            }
            document.getElementById('emailTestResult').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';
            submitForm('/api/settings/testEmail', {toEmail: toEmail}, function(result) {
                if (result.success) {
                    document.getElementById('emailTestResult').innerHTML = '<span style="color:green;"><i class="fas fa-check"></i> 测试邮件已发送到 ' + toEmail + '</span>';
                } else {
                    document.getElementById('emailTestResult').innerHTML = '<span style="color:red;"><i class="fas fa-times"></i> ' + (result.message || '发送失败') + '</span>';
                }
            });
        }

        // 页面加载时从数据库获取已保存的邮件配置
        (function loadSavedSettings() {
            fetchData('/api/settings', function(result) {
                if (result.success) {
                    if (result.smtp_host) document.getElementById('smtpHost').value = result.smtp_host;
                    if (result.smtp_port) document.getElementById('smtpPort').value = result.smtp_port;
                    if (result.smtp_email) document.getElementById('senderEmail').value = result.smtp_email;
                    if (result.smtp_password) document.getElementById('senderPassword').value = result.smtp_password;
                }
            });
        })();

        function testAI() {
            document.getElementById('aiTestResult').textContent = '测试中...';
            var url = document.getElementById('aiUrl').value;
            fetch(url + '/api/tags', { method: 'GET' })
                .then(function(r) {
                    if (r.ok) {
                        document.getElementById('aiTestResult').innerHTML = '<span style="color:green;"><i class="fas fa-check"></i> Ollama服务正常</span>';
                    } else {
                        document.getElementById('aiTestResult').innerHTML = '<span style="color:red;"><i class="fas fa-times"></i> 服务响应异常</span>';
                    }
                })
                .catch(function() {
                    document.getElementById('aiTestResult').innerHTML = '<span style="color:red;"><i class="fas fa-times"></i> 无法连接Ollama，请确认已安装并启动</span>';
                });
        }

        function saveAIConfig() {
            var config = {
                url: document.getElementById('aiUrl').value,
                model: document.getElementById('aiModel').value
            };
            submitForm('/api/settings/ai', config, function(result) {
                if (result.success) showMessage('AI配置已保存', 'success');
                else showMessage(result.message || '保存失败', 'danger');
            });
        }

        function saveReminderConfig() {
            var config = {
                interval: document.getElementById('reminderInterval').value,
                sound: document.getElementById('soundType').value
            };
            showMessage('提醒设置已保存', 'success');
        }

        // 电子签名配置
        function saveSignatureConfig() {
            var autoLoad = document.getElementById('autoLoadSignature').checked;
            localStorage.setItem('autoLoadSignature', autoLoad ? 'true' : 'false');
            showMessage('电子签名设置已保存', 'success');
        }

        // 页面加载时恢复电子签名设置
        (function loadSignatureConfig() {
            var autoLoad = localStorage.getItem('autoLoadSignature');
            if (autoLoad === 'true') {
                document.getElementById('autoLoadSignature').checked = true;
            }
        })();
    </script>
</body>
</html>
