<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分配合同 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
            <h4><i class="fas fa-tasks"></i> 分配合同</h4>
            <button class="btn btn-sm btn-outline-primary" onclick="loadAssignData()"><i class="fas fa-sync-alt"></i> 刷新</button>
        </div>

        <!-- 待分配合同列表 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-list"></i> 待分配合同
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="text-center">选择</th>
                            <th>合同编号</th>
                            <th>合同名称</th>
                            <th>客户</th>
                            <th>起草人</th>
                            <th>起草时间</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="contractTbody">
                        <tr>
                            <td colspan="7" class="text-center" style="padding: 30px; color: #999;">
                                <i class="fas fa-spinner fa-spin"></i> 加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 人员分配区域 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-user-plus"></i> 人员分配
            </div>
            <div class="assign-columns">
                <!-- 会签人员 -->
                <div class="assign-column">
                    <div class="column-title">
                        <span><i class="fas fa-users"></i> 会签人员</span>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toggleSelectAll('countersignUsers', this)">
                            全选/取消
                        </button>
                    </div>
                    <div class="checkbox-list" id="countersignUsersList">
                        <div style="text-align: center; padding: 20px; color: #999;">
                            <i class="fas fa-spinner fa-spin"></i> 加载中...
                        </div>
                    </div>
                </div>

                <!-- 审批人员 -->
                <div class="assign-column">
                    <div class="column-title">
                        <span><i class="fas fa-thumbs-up"></i> 审批人员</span>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toggleSelectAll('approveUsers', this)">
                            全选/取消
                        </button>
                    </div>
                    <div class="checkbox-list" id="approveUsersList">
                        <div style="text-align: center; padding: 20px; color: #999;">
                            <i class="fas fa-spinner fa-spin"></i> 加载中...
                        </div>
                    </div>
                </div>

                <!-- 签订人员 -->
                <div class="assign-column">
                    <div class="column-title">
                        <span><i class="fas fa-signature"></i> 签订人员</span>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toggleSelectAll('signUsers', this)">
                            全选/取消
                        </button>
                    </div>
                    <div class="checkbox-list" id="signUsersList">
                        <div style="text-align: center; padding: 20px; color: #999;">
                            <i class="fas fa-spinner fa-spin"></i> 加载中...
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button type="button" class="btn btn-primary btn-lg" onclick="submitAssign()">
                    <i class="fas fa-check"></i> 确认分配
                </button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        var selectedContract = '';

        function loadAssignData() {
            loadContracts();
            loadAssignableUsers();
        }

        function loadContracts() {
            document.getElementById('contractTbody').innerHTML =
                '<tr><td colspan="7" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
            fetchData('/api/contracts/unassigned', function(result) {
                if (!result.success) {
                    document.getElementById('contractTbody').innerHTML =
                        '<tr><td colspan="7" class="text-center" style="padding: 30px; color: #e74c3c;"><i class="fas fa-exclamation-circle"></i> ' + (result.message || '加载失败') + '</td></tr>';
                    return;
                }
                renderContracts(result.data || []);
            });
        }

        function renderContracts(contracts) {
            var tbody = document.getElementById('contractTbody');
            if (contracts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-inbox"></i> 暂无待分配合同</td></tr>';
                return;
            }
            var html = '';
            contracts.forEach(function(c) {
                html += '<tr>' +
                    '<td class="text-center"><input type="radio" name="contractNum" value="' + (c.num || '') + '" onclick="selectContract(this)"></td>' +
                    '<td>' + (c.num || '') + '</td>' +
                    '<td>' + (c.name || '') + '</td>' +
                    '<td>' + (c.customer || '') + '</td>' +
                    '<td>' + (c.userName || '') + '</td>' +
                    '<td>' + formatDate(c.beginTime) + '</td>' +
                    '<td><span class="badge badge-draft">待分配</span></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        function loadAssignableUsers() {
            fetchData('/api/contracts/assignable-users', function(result) {
                if (!result.success) {
                    document.getElementById('countersignUsersList').innerHTML =
                        '<div style="text-align: center; padding: 20px; color: #e74c3c;"><i class="fas fa-exclamation-circle"></i> 加载失败</div>';
                    document.getElementById('approveUsersList').innerHTML =
                        '<div style="text-align: center; padding: 20px; color: #e74c3c;"><i class="fas fa-exclamation-circle"></i> 加载失败</div>';
                    document.getElementById('signUsersList').innerHTML =
                        '<div style="text-align: center; padding: 20px; color: #e74c3c;"><i class="fas fa-exclamation-circle"></i> 加载失败</div>';
                    return;
                }
                var data = result.data || {};
                renderUserList('countersignUsersList', 'countersignUsers', 'cs', data.countersignUsers || [], '暂无可分配的会签人员');
                renderUserList('approveUsersList', 'approveUsers', 'ap', data.approveUsers || [], '暂无可分配的审批人员');
                renderUserList('signUsersList', 'signUsers', 'sg', data.signUsers || [], '暂无可分配的签订人员');
            });
        }

        function renderUserList(containerId, checkboxName, prefix, users, emptyText) {
            var container = document.getElementById(containerId);
            if (users.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">' + emptyText + '</div>';
                return;
            }
            var html = '';
            users.forEach(function(u, idx) {
                var id = prefix + '_' + idx;
                html += '<div class="checkbox-item">' +
                    '<input type="checkbox" name="' + checkboxName + '" value="' + (u.name || '') + '" id="' + id + '">' +
                    '<label for="' + id + '">' + (u.name || '') + '</label>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function selectContract(radio) {
            selectedContract = radio.value;
        }

        function toggleSelectAll(checkboxName, btn) {
            var checkboxes = document.querySelectorAll('input[name="' + checkboxName + '"]');
            var allChecked = true;
            for (var i = 0; i < checkboxes.length; i++) {
                if (!checkboxes[i].checked) {
                    allChecked = false;
                    break;
                }
            }
            for (var i = 0; i < checkboxes.length; i++) {
                checkboxes[i].checked = !allChecked;
            }
        }

        function submitAssign() {
            if (!selectedContract) {
                showMessage('请先选择要分配的合同', 'danger');
                return;
            }

            var countersignUsers = [];
            var approveUsers = [];
            var signUsers = [];

            document.querySelectorAll('input[name="countersignUsers"]:checked').forEach(function(cb) {
                countersignUsers.push(cb.value);
            });
            document.querySelectorAll('input[name="approveUsers"]:checked').forEach(function(cb) {
                approveUsers.push(cb.value);
            });
            document.querySelectorAll('input[name="signUsers"]:checked').forEach(function(cb) {
                signUsers.push(cb.value);
            });

            if (countersignUsers.length === 0 && approveUsers.length === 0 && signUsers.length === 0) {
                showMessage('请至少选择一种类型的人员', 'danger');
                return;
            }

            // 锁定按钮，防止重复提交
            var submitBtn = document.querySelector('.action-bar button');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 分配中...';
            }

            submitForm('/api/contract/assign', {
                contractNum: selectedContract,
                countersignUsers: countersignUsers,
                approveUsers: approveUsers,
                signUsers: signUsers
            }, function(result) {
                // 解锁按钮
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> 确认分配';
                }
                if (result.success) {
                    reloadWithMessage('合同分配成功', 'success');
                } else {
                    showMessage(result.message || '分配失败', 'danger');
                }
            });
        }

        // 页面加载时获取数据
        loadAssignData();
    </script>
</body>
</html>
