<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>起草合同 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-pen-fancy"></i> 起草合同</h4>
        </div>

        <!-- 起草合同表单 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-edit"></i> 合同信息
            </div>
            <form id="draftForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">合同名称 <span class="required">*</span></label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="请输入合同名称" required>
                    </div>
                    <div class="form-group">
                        <label for="customer">客户</label>
                        <select class="form-control" id="customer" name="customer">
                            <option value="">-- 请选择客户 --</option>
                            <option th:each="c : ${customers}" th:value="${c.name}" th:text="${c.name}">客户名称</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="beginTime">开始时间</label>
                        <input type="date" class="form-control" id="beginTime" name="beginTime" data-default-today>
                        <div class="date-shortcuts">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('beginTime', 0, -6)">减半年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('beginTime', 0, 6)">加半年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('beginTime', -1, 0)">减一年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('beginTime', 1, 0)">加一年</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="endTime">结束时间</label>
                        <input type="date" class="form-control" id="endTime" name="endTime">
                        <div class="date-shortcuts">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('endTime', 0, -6)">减半年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('endTime', 0, 6)">加半年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('endTime', -1, 0)">减一年</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="adjustDate('endTime', 1, 0)">加一年</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">合同内容</label>
                    <textarea class="form-control" id="content" name="content" rows="8"
                              placeholder="请输入合同内容条款"></textarea>
                </div>

                <div class="form-group">
                    <label>合同文档</label>
                    <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>点击上传合同文档</p>
                        <p style="font-size: 12px; color: #999;">支持 doc/jpg/jpeg/png/bmp/gif/pdf 格式</p>
                        <div id="filePreview"></div>
                    </div>
                    <input type="file" id="fileInput" name="file" style="display: none;"
                           accept=".doc,.docx,.jpg,.jpeg,.png,.bmp,.gif,.pdf"
                           onchange="handleFileSelect(this, 'filePreview')">
                </div>

                <div class="action-bar">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-paper-plane"></i> 提交起草
                    </button>
                    <button type="reset" class="btn btn-secondary btn-lg">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('draftForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value.trim();
            if (!name) {
                showMessage('请输入合同名称', 'danger');
                return;
            }

            var fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                var formData = new FormData();
                formData.append('name', name);
                formData.append('customer', document.getElementById('customer').value);
                formData.append('beginTime', document.getElementById('beginTime').value);
                formData.append('endTime', document.getElementById('endTime').value);
                formData.append('content', document.getElementById('content').value);
                formData.append('file', fileInput.files[0]);

                submitFormWithFile('/api/contract/draft', formData, function(result) {
                    if (result.success) {
                        showMessage('合同起草成功', 'success');
                        document.getElementById('draftForm').reset();
                        document.getElementById('filePreview').innerHTML = '';
                    } else {
                        showMessage(result.message || '起草失败', 'danger');
                    }
                });
            } else {
                submitForm('/api/contract/draft', {
                    name: name,
                    customer: document.getElementById('customer').value,
                    beginTime: document.getElementById('beginTime').value,
                    endTime: document.getElementById('endTime').value,
                    content: document.getElementById('content').value
                }, function(result) {
                    if (result.success) {
                        showMessage('合同起草成功', 'success');
                        document.getElementById('draftForm').reset();
                    } else {
                        showMessage(result.message || '起草失败', 'danger');
                    }
                });
            }
        });
    </script>
</body>
</html>
