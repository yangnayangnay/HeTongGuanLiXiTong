<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计分析 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <div class="page-header">
            <h4><i class="fas fa-chart-bar"></i> 统计分析</h4>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
            <div class="content-card" style="text-align: center; border-left: 4px solid #3498db;">
                <div style="font-size: 32px; font-weight: bold; color: #3498db;" id="statTotal">0</div>
                <div style="color: #666;">合同总数</div>
            </div>
            <div class="content-card" style="text-align: center; border-left: 4px solid #27ae60;">
                <div style="font-size: 32px; font-weight: bold; color: #27ae60;" id="statAmount">0</div>
                <div style="color: #666;">合同总金额(元)</div>
            </div>
            <div class="content-card" style="text-align: center; border-left: 4px solid #f39c12;">
                <div style="font-size: 32px; font-weight: bold; color: #f39c12;" id="statPending">0</div>
                <div style="color: #666;">进行中</div>
            </div>
            <div class="content-card" style="text-align: center; border-left: 4px solid #1abc9c;">
                <div style="font-size: 32px; font-weight: bold; color: #1abc9c;" id="statCompleted">0</div>
                <div style="color: #666;">已完成</div>
            </div>
        </div>

        <div class="content-card">
            <div class="card-title"><i class="fas fa-chart-pie"></i> 合同状态分布</div>
            <div id="stateChart" style="padding: 20px;">
                <div style="display: flex; flex-direction: column; gap: 12px;" id="stateBars">
                    <div style="text-align:center;color:#999;padding:20px;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
                </div>
            </div>
        </div>

        <div class="content-card" style="margin-top: 16px;">
            <div class="card-title"><i class="fas fa-download"></i> 数据导出</div>
            <div style="display: flex; gap: 10px;">
                <a href="/api/contracts/export?format=csv" class="btn btn-outline-primary">
                    <i class="fas fa-file-csv"></i> 导出CSV
                </a>
                <a href="/api/contracts/export?format=html" class="btn btn-outline-info">
                    <i class="fas fa-file-code"></i> 导出HTML报表
                </a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        fetchData('/api/statistics', function(result) {
            if (result.success) {
                var d = result.data;
                document.getElementById('statTotal').textContent = d.total || 0;
                document.getElementById('statAmount').textContent = (d.totalAmount || 0).toLocaleString();
                document.getElementById('statPending').textContent = (d.draft || 0) + (d.countersign || 0) + (d.finalize || 0) + (d.approve || 0) + (d.sign || 0);
                document.getElementById('statCompleted').textContent = d.completed || 0;

                var states = [
                    {name: '起草中', count: d.draft || 0, color: '#95a5a6'},
                    {name: '会签中', count: d.countersign || 0, color: '#3498db'},
                    {name: '定稿中', count: d.finalize || 0, color: '#f39c12'},
                    {name: '审批中', count: d.approve || 0, color: '#9b59b6'},
                    {name: '签订中', count: d.sign || 0, color: '#27ae60'},
                    {name: '已完成', count: d.completed || 0, color: '#1abc9c'}
                ];
                var maxCount = Math.max.apply(null, states.map(function(s) { return s.count; })) || 1;
                var barsHtml = '';
                states.forEach(function(s) {
                    var pct = Math.round(s.count / (d.total || 1) * 100);
                    var barWidth = Math.round(s.count / maxCount * 100);
                    barsHtml += '<div style="display:flex;align-items:center;gap:12px;">' +
                        '<div style="width:60px;font-weight:bold;">' + s.name + '</div>' +
                        '<div style="flex:1;background:#eee;border-radius:4px;height:28px;overflow:hidden;">' +
                        '<div style="width:' + barWidth + '%;height:100%;background:' + s.color + ';border-radius:4px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:12px;">' +
                        s.count + ' (' + pct + '%)</div></div></div>';
                });
                document.getElementById('stateBars').innerHTML = barsHtml;
            } else {
                document.getElementById('stateBars').innerHTML = '<div style="text-align:center;color:#e74c3c;padding:20px;"><i class="fas fa-exclamation-circle"></i> 加载失败，请刷新重试</div>';
            }
        });
    </script>
</body>
</html>
