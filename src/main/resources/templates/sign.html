<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签订合同 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-signature"></i> 签订合同</h4>
        </div>

        <!-- 待签订合同列表 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-list"></i> 待签订合同
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>合同编号</th>
                            <th>合同名称</th>
                            <th>客户</th>
                            <th>起草人</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="contract : ${contracts}">
                            <td th:text="${contract.num}">HT2024001</td>
                            <td th:text="${contract.name}">合同名称</td>
                            <td th:text="${contract.customer}">客户名称</td>
                            <td th:text="${contract.userName}">起草人</td>
                            <td th:text="${contract.beginTime != null ? #dates.format(contract.beginTime, 'yyyy-MM-dd') : ''}">2024-01-01</td>
                            <td th:text="${contract.endTime != null ? #dates.format(contract.endTime, 'yyyy-MM-dd') : ''}">2024-12-31</td>
                            <td class="text-nowrap">
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:onclick="'viewContract(\'' + ${contract.num} + '\')'">
                                    <i class="fas fa-eye"></i> 查看
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-info"
                                        th:onclick="'downloadContract(\'' + ${contract.num} + '\')'">
                                    <i class="fas fa-download"></i> 下载
                                </button>
                                <button type="button" class="btn btn-sm btn-success"
                                        th:onclick="'confirmSign(\'' + ${contract.num} + '\')'">
                                    <i class="fas fa-signature"></i> 签订
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contracts)}">
                            <td colspan="7" class="text-center" style="padding: 30px; color: #999;">
                                <i class="fas fa-inbox"></i> 暂无待签订合同
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 查看合同详情模态框 -->
    <div id="viewModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog" style="max-width: 700px;">
            <div class="modal-header">
                <h5><i class="fas fa-file-contract"></i> 合同详情</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('viewModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="contractDetail">
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <style>
    .signature-canvas { border: 2px dashed #ccc; border-radius: 8px; cursor: crosshair; background: #fff; }
    .signature-canvas:hover { border-color: #3498db; }
    </style>
    <script>
        var currentSignNum = '';
        var signatureCanvas, signatureCtx, isDrawing = false;
        var uploadedSignatureUrl = '';

        function viewContract(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    document.getElementById('contractDetail').innerHTML =
                        '<div class="detail-grid">' +
                        '<div class="detail-item"><span class="detail-label">合同编号：</span><span class="detail-value">' + (c.num || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">合同名称：</span><span class="detail-value">' + (c.name || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">客户：</span><span class="detail-value">' + (c.customer || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">起草人：</span><span class="detail-value">' + (c.userName || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">开始时间：</span><span class="detail-value">' + formatDate(c.beginTime) + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">结束时间：</span><span class="detail-value">' + formatDate(c.endTime) + '</span></div>' +
                        '</div>' +
                        '<div style="margin-top: 16px;"><strong>合同内容：</strong><div style="margin-top: 8px; padding: 12px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap;">' + (c.content || '无') + '</div></div>' +
                        (c.fileName ? '<div style="margin-top: 12px;"><strong>合同附件：</strong><a href="/api/files/download/' + c.num + '" class="btn btn-sm btn-outline-primary ml-2" target="_blank"><i class="fas fa-download"></i> ' + c.fileName + '</a></div>' : '');
                    openModal('viewModal');
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function downloadContract(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    var content = c.content || '';
                    if (!content) {
                        showMessage('合同内容为空，无法下载', 'danger');
                        return;
                    }
                    var name = c.name || '合同';
                    var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = name + '.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                    showMessage('合同内容已下载', 'success');
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function confirmSign(num) {
            currentSignNum = num;
            uploadedSignatureUrl = '';
            document.getElementById('signaturePreview').innerHTML = '';
            openModal('signModal');
            initSignaturePad();
        }

        function initSignaturePad() {
            signatureCanvas = document.getElementById('signatureCanvas');
            signatureCtx = signatureCanvas.getContext('2d');
            signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            isDrawing = false;

            signatureCanvas.onmousedown = function(e) { isDrawing = true; signatureCtx.beginPath(); signatureCtx.moveTo(e.offsetX, e.offsetY); };
            signatureCanvas.onmousemove = function(e) { if (isDrawing) { signatureCtx.lineTo(e.offsetX, e.offsetY); signatureCtx.strokeStyle = '#000'; signatureCtx.lineWidth = 2; signatureCtx.stroke(); } };
            signatureCanvas.onmouseup = function() { isDrawing = false; };
            signatureCanvas.onmouseleave = function() { isDrawing = false; };

            // Touch support
            signatureCanvas.ontouchstart = function(e) { e.preventDefault(); var t = e.touches[0]; var r = signatureCanvas.getBoundingClientRect(); isDrawing = true; signatureCtx.beginPath(); signatureCtx.moveTo(t.clientX - r.left, t.clientY - r.top); };
            signatureCanvas.ontouchmove = function(e) { e.preventDefault(); if (isDrawing) { var t = e.touches[0]; var r = signatureCanvas.getBoundingClientRect(); signatureCtx.lineTo(t.clientX - r.left, t.clientY - r.top); signatureCtx.strokeStyle = '#000'; signatureCtx.lineWidth = 2; signatureCtx.stroke(); } };
            signatureCanvas.ontouchend = function() { isDrawing = false; };
        }

        function clearSignature() {
            if (signatureCtx) signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            uploadedSignatureUrl = '';
            document.getElementById('signaturePreview').innerHTML = '';
        }

        function uploadSignatureImage() {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var formData = new FormData();
                formData.append('file', file);
                fetch('/api/contract/uploadSignature', {
                    method: 'POST',
                    body: formData
                }).then(function(r) { return r.json(); })
                .then(function(result) {
                    if (result.success) {
                        uploadedSignatureUrl = result.signatureUrl;
                        document.getElementById('signaturePreview').innerHTML =
                            '<img src="' + result.signatureUrl + '" style="max-width: 200px; max-height: 80px; border: 1px solid #ddd; border-radius: 4px; padding: 4px;">';
                        // Clear canvas since uploaded image takes precedence
                        if (signatureCtx) signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
                        showMessage('签名图片已上传', 'success');
                    } else {
                        showMessage(result.message || '签名上传失败', 'danger');
                    }
                });
            };
            input.click();
        }

        function submitSign() {
            var canvas = document.getElementById('signatureCanvas');
            var ctx = canvas.getContext('2d');
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var hasContent = false;
            for (var i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] > 0) { hasContent = true; break; }
            }
            if (!hasContent && !uploadedSignatureUrl) {
                if (!confirm('您尚未签名，确认直接签订？')) return;
            }
            submitForm('/api/contract/sign', {
                contractNum: currentSignNum,
                content: uploadedSignatureUrl ? '[签名图片]\n' + uploadedSignatureUrl : '签订确认'
            }, function(result) {
                if (result.success) {
                    showMessage('合同签订成功', 'success');
                    closeModal('signModal');
                    setTimeout(function() { location.reload(); }, 1500);
                } else {
                    showMessage(result.message || '签订失败', 'danger');
                }
            });
        }
    </script>

    <!-- 签订模态框 -->
    <div id="signModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog" style="max-width: 600px;">
            <div class="modal-header">
                <h5><i class="fas fa-signature"></i> 电子签名签订</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('signModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 10px;">请在下方签名区域手写签名，或上传签名图片：</p>
                <canvas id="signatureCanvas" class="signature-canvas" width="520" height="200"></canvas>
                <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearSignature()">
                        <i class="fas fa-eraser"></i> 清除重签
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="uploadSignatureImage()">
                        <i class="fas fa-image"></i> 上传签名图片
                    </button>
                </div>
                <div id="signaturePreview" style="margin-top: 8px;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" onclick="submitSign()">
                    <i class="fas fa-check"></i> 确认签订
                </button>
                <button type="button" class="btn btn-secondary" onclick="closeModal('signModal')">
                    取消
                </button>
            </div>
        </div>
    </div>
</body>
</html>
