<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签订合同 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <div class="page-header"><h4><i class="fas fa-signature"></i> 签订合同</h4></div>
        <div class="content-card">
            <div class="card-title"><i class="fas fa-list"></i> 待签订合同</div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead><tr><th>合同编号</th><th>合同名称</th><th>客户</th><th>起草人</th><th>开始时间</th><th>结束时间</th><th>操作</th></tr></thead>
                    <tbody id="contractList"><tr><td colspan="7" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>


    <div id="viewModal" class="modal-overlay" style="display: none;">
        <div class="c-modal-dialog" style="max-width: 700px;">
            <div class="c-modal-header"><h5><i class="fas fa-file-contract"></i> 合同详情</h5><button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('viewModal')"><i class="fas fa-times"></i></button></div>
            <div class="c-modal-body" id="contractDetail"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <style>
    .signature-canvas { border: 2px dashed #ccc; border-radius: 8px; cursor: crosshair; background: #fff; }
    .signature-canvas:hover { border-color: #3498db; }
    .party-select { display: flex; gap: 12px; margin-bottom: 12px; }
    .party-option { flex: 1; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .party-option:hover { border-color: #3498db; }
    .party-option.selected { border-color: #3498db; background: #eaf2f8; }
    .party-option i { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
    <script>
        var currentSignNum = '';
        var signatureCanvas, signatureCtx, isDrawing = false;
        var selectedParty = '';

        function loadContracts() {
            document.getElementById('contractList').innerHTML = '<tr><td colspan="7" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
            fetchData('/api/tasks/pending', function(result) {
                if (!result.success) { document.getElementById('contractList').innerHTML = '<tr><td colspan="7" class="text-center" style="color:#e74c3c;">加载失败</td></tr>'; return; }
                var tasks = (result.data || []).filter(function(t) { return t.type === 3; });
                if (tasks.length === 0) { document.getElementById('contractList').innerHTML = '<tr><td colspan="7" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-inbox"></i> 暂无待签订合同</td></tr>'; return; }
                var html = '';
                tasks.forEach(function(t) {
                    html += '<tr><td>' + (t.conNum || '') + '</td><td>' + (t.contractName || '') + '</td><td>-</td><td>-</td><td>-</td><td>-</td><td class="text-nowrap">' +
                        '<button type="button" class="btn btn-sm btn-outline-warning" onclick="viewOpinions(\'' + t.conNum + '\')"><i class="fas fa-comments"></i> 意见</button> ' +
                        '<button type="button" class="btn btn-sm btn-outline-primary" onclick="viewContract(\'' + t.conNum + '\')"><i class="fas fa-eye"></i> 查看</button> ' +
                        '<button type="button" class="btn btn-sm btn-outline-info" onclick="downloadContract(\'' + t.conNum + '\')"><i class="fas fa-download"></i> 下载</button> ' +
                        '<button type="button" class="btn btn-sm btn-success" onclick="openSign(\'' + t.conNum + '\')"><i class="fas fa-signature"></i> 签订</button></td></tr>';
                });
                document.getElementById('contractList').innerHTML = html;
            });
        }

        function viewContract(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    document.getElementById('contractDetail').innerHTML =
                        '<div class="detail-grid">' +
                        '<div class="detail-item"><span class="detail-label">合同编号：</span><span class="detail-value">' + (c.num || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">合同名称：</span><span class="detail-value">' + (c.name || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">客户：</span><span class="detail-value">' + (c.customer || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">起草人：</span><span class="detail-value">' + (c.userName || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">开始时间：</span><span class="detail-value">' + formatDate(c.beginTime) + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">结束时间：</span><span class="detail-value">' + formatDate(c.endTime) + '</span></div>' +
                        '</div>' +
                        '<div style="margin-top: 16px;"><strong>合同内容：</strong><div style="margin-top: 8px; padding: 12px; background: #f8f9fa; border-radius: 4px; white-space: pre-line;">' + renderContractContent(c.content) + '</div></div>' +
                        (c.fileName ? '<div style="margin-top: 12px;"><strong>合同附件：</strong><a href="/api/files/download/' + c.num + '" class="btn btn-sm btn-outline-primary ml-2" target="_blank"><i class="fas fa-download"></i> ' + c.fileName + '</a></div>' : '');
                    openModal('viewModal');
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function downloadContract(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    var content = c.content || '';
                    if (!content) {
                        showMessage('合同内容为空，无法下载', 'danger');
                        return;
                    }
                    var name = c.name || '合同';
                    fetch('/api/contract/downloadContent', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({content: content, name: name, format: 'pdf'})
                    }).then(function(r) { return r.blob(); })
                    .then(function(blob) {
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = name + '.pdf';
                        a.click();
                        URL.revokeObjectURL(url);
                        showMessage('合同已导出为PDF', 'success');
                    });
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function selectParty(party) {
            selectedParty = party;
            document.querySelectorAll('.party-option').forEach(function(el) {
                el.classList.remove('selected');
            });
            document.querySelector('.party-option[data-party="' + party + '"]').classList.add('selected');
        }

        function openSign(num) {
            currentSignNum = num;
            selectedParty = '';
            document.querySelectorAll('.party-option').forEach(function(el) {
                el.classList.remove('selected');
            });
            openModal('signModal');
            initSignaturePad();
        }

        function initSignaturePad() {
            signatureCanvas = document.getElementById('signatureCanvas');
            signatureCtx = signatureCanvas.getContext('2d');
            signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            isDrawing = false;

            signatureCanvas.onmousedown = function(e) { isDrawing = true; signatureCtx.beginPath(); signatureCtx.moveTo(e.offsetX, e.offsetY); };
            signatureCanvas.onmousemove = function(e) { if (isDrawing) { signatureCtx.lineTo(e.offsetX, e.offsetY); signatureCtx.strokeStyle = '#000'; signatureCtx.lineWidth = 2; signatureCtx.stroke(); } };
            signatureCanvas.onmouseup = function() { isDrawing = false; };
            signatureCanvas.onmouseleave = function() { isDrawing = false; };

            // Touch support
            signatureCanvas.ontouchstart = function(e) { e.preventDefault(); var t = e.touches[0]; var r = signatureCanvas.getBoundingClientRect(); isDrawing = true; signatureCtx.beginPath(); signatureCtx.moveTo(t.clientX - r.left, t.clientY - r.top); };
            signatureCanvas.ontouchmove = function(e) { e.preventDefault(); if (isDrawing) { var t = e.touches[0]; var r = signatureCanvas.getBoundingClientRect(); signatureCtx.lineTo(t.clientX - r.left, t.clientY - r.top); signatureCtx.strokeStyle = '#000'; signatureCtx.lineWidth = 2; signatureCtx.stroke(); } };
            signatureCanvas.ontouchend = function() { isDrawing = false; };
        }

        function clearSignature() {
            if (signatureCtx) signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);

        }

        function submitSign() {
            if (!selectedParty) {
                showMessage('请选择您代表的签约方（甲方/乙方）', 'danger');
                return;
            }

            var canvas = document.getElementById('signatureCanvas');
            var ctx = canvas.getContext('2d');
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var hasContent = false;
            for (var i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] > 0) { hasContent = true; break; }
            }
            if (!hasContent) {
                showMessage('请先手写签名后再签订', 'danger');
                return;
            }

            var signatureDataUrl = canvas.toDataURL('image/png');
            var btn = document.querySelector('#signModal .c-modal-footer .btn-success');
            var origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 签订中...';

            submitForm('/api/contract/sign', {
                contractNum: currentSignNum,
                content: '[手写签名]',
                party: selectedParty,
                signatureImage: signatureDataUrl
            }, function(result) {
                btn.disabled = false;
                btn.innerHTML = origHtml;
                if (result.success) {
                    closeModal('signModal');
                    showMessage('合同签订成功', 'success');
                    notifyTaskCompleted();
                    setTimeout(function(){loadContracts();}, 1000);
                } else {
                    showMessage(result.message || '签订失败', 'danger');
                }
            });
        }
        function viewOpinions(num) {
            fetchData('/api/contract/opinions?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var html = '';
                    var list = result.data || [];
                    if (list.length === 0) {
                        html = '<div style="text-align: center; padding: 20px; color: #999;">暂无历史意见</div>';
                    } else {
                        list.forEach(function(item) {
                            var stateColor = item.state === 1 ? '#27ae60' : (item.state === 2 ? '#e74c3c' : '#f39c12');
                            html += '<div style="border-bottom: 1px solid #eee; padding: 12px 0;">' +
                                '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">' +
                                '<div><strong><i class="fas fa-user"></i> ' + (item.userName || '') + '</strong> ' +
                                '<span class="badge" style="background:' + (item.type === 1 ? '#3498db' : item.type === 2 ? '#9b59b6' : '#27ae60') + ';color:#fff;margin-left:6px;">' + (item.typeName || '') + '</span> ' +
                                '<span class="badge" style="background:' + stateColor + ';color:#fff;">' + (item.stateName || '') + '</span></div>' +
                                '<span style="color: #999; font-size: 12px;">' + formatDate(item.time) + '</span>' +
                                '</div>' +
                                '<div style="padding: 8px; background: #f8f9fa; border-radius: 4px;">' + (item.content || '无意见') + '</div>' +
                                '</div>';
                        });
                    }
                    document.getElementById('opinionsList').innerHTML = html;
                    openModal('opinionsModal');
                } else {
                    showMessage(result.message || '获取意见失败', 'danger');
                }
            });
        }
    </script>

    <!-- 签订模态框 -->
    <div id="signModal" class="modal-overlay" style="display: none;">
        <div class="c-modal-dialog" style="max-width: 600px;">
            <div class="c-modal-header">
                <h5><i class="fas fa-signature"></i> 电子签名签订</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('signModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="c-modal-body">
                <!-- 选择甲方/乙方 -->
                <div class="form-group">
                    <label>选择签约方身份 <span class="required">*</span></label>
                    <div class="party-select">
                        <div class="party-option" data-party="甲方" onclick="selectParty('甲方')">
                            <i class="fas fa-landmark" style="color: #2980B9;"></i>
                            <strong>甲方</strong>
                            <div style="font-size: 12px; color: #666;">（我方/采购方）</div>
                        </div>
                        <div class="party-option" data-party="乙方" onclick="selectParty('乙方')">
                            <i class="fas fa-handshake" style="color: #27AE60;"></i>
                            <strong>乙方</strong>
                            <div style="font-size: 12px; color: #666;">（对方/供应方）</div>
                        </div>
                    </div>
                </div>
                <p style="margin-bottom: 10px;">请在下方签名区域手写签名：</p>
                <canvas id="signatureCanvas" class="signature-canvas" width="520" height="200"></canvas>
                <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearSignature()">
                        <i class="fas fa-eraser"></i> 清除重签
                    </button>
                </div>

            </div>
            <div class="c-modal-footer">
                <button type="button" class="btn btn-success" onclick="submitSign()">
                    <i class="fas fa-check"></i> 确认签订
                </button>
                <button type="button" class="btn btn-secondary" onclick="closeModal('signModal')">
                    取消
                </button>
            </div>
        </div>
    </div>

    <div id="opinionsModal" class="modal-overlay" style="display: none;">
        <div class="c-modal-dialog" style="max-width: 700px;">
            <div class="c-modal-header">
                <h5><i class="fas fa-comments"></i> 历史意见</h5>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('opinionsModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="c-modal-body" id="opinionsList"></div>
        </div>
    </div>
    <script>loadContracts();</script>
</body>
</html>
