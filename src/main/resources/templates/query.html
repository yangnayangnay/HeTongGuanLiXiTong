<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同查询 - 合同管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="page-header">
            <h4><i class="fas fa-search"></i> 合同查询</h4>
        </div>

        <!-- 搜索区域 -->
        <div class="content-card">
            <div class="search-bar">
                <input type="text" class="form-control" id="searchName" placeholder="按合同名称模糊查询"
                       style="min-width: 200px;">
                <select class="form-control" id="searchState" style="min-width: 140px;">
                    <option value="">全部状态</option>
                    <option value="1">起草</option>
                    <option value="2">会签</option>
                    <option value="3">定稿</option>
                    <option value="4">审批</option>
                    <option value="5">签订</option>
                </select>
                <button type="button" class="btn btn-primary" onclick="searchContracts()">
                    <i class="fas fa-search"></i> 查询
                </button>
                <button type="button" class="btn btn-secondary" onclick="resetSearch()">
                    <i class="fas fa-undo"></i> 重置
                </button>
            </div>
        </div>

        <!-- 合同列表 -->
        <div class="content-card">
            <div class="card-title">
                <i class="fas fa-list"></i> 合同列表
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>合同编号</th>
                            <th>合同名称</th>
                            <th>客户</th>
                            <th>起草人</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>当前状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="contractList">
                        <tr th:each="contract : ${contracts}">
                            <td th:text="${contract.num}">HT2024001</td>
                            <td th:text="${contract.name}">合同名称</td>
                            <td th:text="${contract.customer}">客户名称</td>
                            <td th:text="${contract.userName}">起草人</td>
                            <td th:text="${contract.beginTime != null ? #dates.format(contract.beginTime, 'yyyy-MM-dd') : ''}">2024-01-01</td>
                            <td th:text="${contract.endTime != null ? #dates.format(contract.endTime, 'yyyy-MM-dd') : ''}">2024-12-31</td>
                            <td th:switch="${contract.stateType}">
                                <span class="badge badge-draft" th:case="1">起草</span>
                                <span class="badge badge-countersign" th:case="2">会签</span>
                                <span class="badge badge-finalize" th:case="3">定稿</span>
                                <span class="badge badge-approve" th:case="4">审批</span>
                                <span class="badge badge-sign" th:case="5">签订</span>
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:data-num="${contract.num}"
                                        onclick="viewDetail(this.dataset.num)">
                                    <i class="fas fa-eye"></i> 详情
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-info"
                                        th:data-num="${contract.num}"
                                        onclick="downloadContract(this.dataset.num)">
                                    <i class="fas fa-download"></i> 下载
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contracts)}">
                            <td colspan="8" class="text-center" style="padding: 30px; color: #999;">
                                <i class="fas fa-inbox"></i> 暂无合同数据
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 合同详情展示区 -->
        <div class="content-card" id="detailSection" style="display: none;">
            <div class="card-title">
                <i class="fas fa-file-contract"></i> 合同详情
            </div>
            <div id="detailContent">
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function searchContracts() {
            var name = document.getElementById('searchName').value.trim();
            var state = document.getElementById('searchState').value;
            var url = '/api/contracts/query?name=' + encodeURIComponent(name);
            if (state) {
                url += '&state=' + state;
            }
            fetchData(url, function(result) {
                if (result.success) {
                    renderContractList(result.data || []);
                } else {
                    showMessage(result.message || '查询失败', 'danger');
                }
            });
        }

        function resetSearch() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchState').value = '';
            location.reload();
        }

        function renderContractList(list) {
            var tbody = document.getElementById('contractList');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center" style="padding: 30px; color: #999;"><i class="fas fa-inbox"></i> 暂无匹配的合同</td></tr>';
                return;
            }
            var html = '';
            list.forEach(function(c) {
                html += '<tr>' +
                    '<td>' + (c.num || '') + '</td>' +
                    '<td>' + (c.name || '') + '</td>' +
                    '<td>' + (c.customer || '') + '</td>' +
                    '<td>' + (c.userName || '') + '</td>' +
                    '<td>' + formatDate(c.beginTime) + '</td>' +
                    '<td>' + formatDate(c.endTime) + '</td>' +
                    '<td>' + getContractStateBadge(c.stateName || '起草') + '</td>' +
                    '<td><button type="button" class="btn btn-sm btn-outline-primary" onclick="viewDetail(\'' + c.num + '\')"><i class="fas fa-eye"></i> 详情</button> <button type="button" class="btn btn-sm btn-outline-info" onclick="downloadContract(\'' + c.num + '\')"><i class="fas fa-download"></i> 下载</button></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        function viewDetail(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    var isAdmin = c.canViewFull;
                    var contentHtml = isAdmin ?
                        '<div style="padding: 12px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap;">' + (c.content || '无') + '</div>' :
                        '<div style="padding: 12px; background: #fff3cd; border-radius: 4px; color: #856404;"><i class="fas fa-lock"></i> 您没有权限查看完整内容</div>';

                    document.getElementById('detailContent').innerHTML =
                        '<div class="detail-grid">' +
                        '<div class="detail-item"><span class="detail-label">合同编号：</span><span class="detail-value">' + (c.num || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">合同名称：</span><span class="detail-value">' + (c.name || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">客户：</span><span class="detail-value">' + (c.customer || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">起草人：</span><span class="detail-value">' + (c.userName || '') + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">开始时间：</span><span class="detail-value">' + formatDate(c.beginTime) + '</span></div>' +
                        '<div class="detail-item"><span class="detail-label">结束时间：</span><span class="detail-value">' + formatDate(c.endTime) + '</span></div>' +
                        '</div>' +
                        '<div style="margin-top: 16px;"><strong>合同内容：</strong>' + contentHtml + '</div>' +
                        (c.fileName ? '<div style="margin-top: 12px;"><strong>合同附件：</strong><a href="/api/files/download/' + c.num + '" class="btn btn-sm btn-outline-primary ml-2" target="_blank"><i class="fas fa-download"></i> ' + c.fileName + '</a></div>' : '');

                    document.getElementById('detailSection').style.display = 'block';
                    document.getElementById('detailSection').scrollIntoView({behavior: 'smooth'});
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }

        function downloadContract(num) {
            fetchData('/api/contract/detail?num=' + encodeURIComponent(num), function(result) {
                if (result.success) {
                    var c = result.data;
                    var content = c.content || '';
                    if (!content) {
                        showMessage('合同内容为空，无法下载', 'danger');
                        return;
                    }
                    var name = c.name || '合同';
                    var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = name + '.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                    showMessage('合同内容已下载', 'success');
                } else {
                    showMessage(result.message || '获取合同详情失败', 'danger');
                }
            });
        }
    </script>
</body>
</html>
